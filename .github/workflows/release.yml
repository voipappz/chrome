# A release: push a tag vX.Y.Z (`make release VERSION=X.Y.Z`) and this builds,
# tests and publishes it as a GitHub Release with ONE ZIP PER CUSTOMER
# (src/customers.js): voipappz-extension-X.Y.Z.zip, nimbus-extension-X.Y.Z.zip.
# NOT the Chrome Web Store. The tag is the version, stamped into each manifest.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the GitHub Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Version from the tag
        id: v
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "$version" | grep -Eq '^[0-9]{1,5}(\.[0-9]{1,5}){0,3}$' \
            || { echo "::error::tag $GITHUB_REF_NAME is not v<chrome version> (e.g. v0.0.14)"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: jdx/mise-action@v2
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run test:unit

      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # Each customer's build, tested as it ships: the version is in the
      # manifest, the offline specs pass on it, its own cable answers, a wrong
      # password gets its own server's refusal, and -- where that customer's
      # test agent is in the secrets -- a real sign-in turns the cable green.
      # The voipappz sign-in is REQUIRED: no release that cannot log in.
      - name: Build, test and zip each customer
        env:
          EXT_VERSION: ${{ steps.v.outputs.version }}
          VOIPAPPZ_USER: ${{ secrets.TEST_USERNAME }}
          VOIPAPPZ_PASS: ${{ secrets.TEST_PASSWORD }}
          NIMBUS_USER: ${{ secrets.NIMBUS_TEST_USERNAME }}
          NIMBUS_PASS: ${{ secrets.NIMBUS_TEST_PASSWORD }}
        run: |
          [ -n "$VOIPAPPZ_USER" ] && [ -n "$VOIPAPPZ_PASS" ] || { echo "::error::TEST_USERNAME / TEST_PASSWORD secrets are required for a release"; exit 1; }
          mkdir -p release
          for c in voipappz nimbus; do
            echo "::group::$c $EXT_VERSION"
            export EXT_CUSTOMER=$c
            npm run build
            node -e "const m=require('./dist/manifest.json'); if (m.version!==process.env.EXT_VERSION) { console.error('manifest says '+m.version); process.exit(1) } console.log(m.name, m.version)"
            npx playwright test mock-
            node scripts/check-live-cable.mjs
            u=$(eval echo "\$$(echo $c | tr a-z A-Z)_USER"); p=$(eval echo "\$$(echo $c | tr a-z A-Z)_PASS")
            TEST_USERNAME="$u" TEST_PASSWORD="$p" npx playwright test live-switch
            (cd dist && python3 -m zipfile -c "../release/$c-extension-$EXT_VERSION.zip" *)
            echo "::endgroup::"
          done
          ls -la release

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.zip \
            --title "Agent extension $VERSION" \
            --notes "One zip per customer:
          - voipappz-extension-$VERSION.zip: logs in at https://switch.voipappz.io, cable wss://switch.voipappz.io/cable
          - nimbus-extension-$VERSION.zip: logs in at https://nimbus-prod.voipappz.io, cable wss://nimbus-prod.voipappz.io/cable

          Install: unzip, then chrome://extensions → Developer mode → Load unpacked → the unzipped folder.
          Built and tested by the Release workflow from ${GITHUB_SHA::7}." \
            --verify-tag
